map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# For Docker service discovery: re-resolve upstream names if containers are recreated.
# Important: Nginx only resolves upstream hostnames once at startup unless proxy_pass uses a variable.
resolver 127.0.0.11 ipv6=off valid=10s;

# ============================================
# HTTP SERVER (Puerto 80)
# ============================================
server {
  listen 80;
  server_name _;

  # Comentado para desarrollo - Descomentar en producción
  # return 301 https://$host$request_uri;

  # Static frontend (SPA)
  root /usr/share/nginx/html;
  index index.html;

  # ========================================
  # SWAGGER / DOCS
  # ========================================
  location ^~ /docs {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    set $gateway_upstream http://gateway:3000;
    proxy_pass $gateway_upstream;
  }

  # ========================================
  # WEBSOCKETS (deben ir ANTES de /api/)
  # ========================================
  
  # WebSocket de COMMS (notificaciones)
  location = /api/comms/ws {
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # DIRECTO A COMMS (NO gateway)
    proxy_pass http://comms:3005/api/comms/ws;
    
    # Timeouts para WebSocket
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # WebSocket de GAME (partidas)
  location = /api/game/ws {
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # DIRECTO A GAME (NO gateway)
    proxy_pass http://game:3003/api/game/ws;
    
    # Timeouts para WebSocket
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # ========================================
  # REST API (vía gateway)
  # ========================================
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    set $gateway_upstream http://gateway:3000;
    proxy_pass $gateway_upstream;
  }

  # ========================================
  # FRONTEND SPA (debe ir al final)
  # ========================================
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# ============================================
# HTTPS SERVER (Puerto 443)
# ============================================
server {
  listen 443 ssl;
  server_name _;

  # Certificados SSL (autogenerados en dev)
  ssl_certificate     /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;

  # Static frontend (SPA)
  root /usr/share/nginx/html;
