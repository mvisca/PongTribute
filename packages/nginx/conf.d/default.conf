map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name _;

  # Certs (montados por volumen o generados en entrypoint)
  ssl_certificate     /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;

  # Static frontend (SPA)
  root /usr/share/nginx/html;
  index index.html;

  # Swagger / OpenAPI (gateway aggregator)
  # Si no existe esta regla, /docs cae en el try_files del frontend y devuelve index.html.
  location ^~ /docs {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass http://gateway:3000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

# ========================================
  # WEBSOCKETS - Deben ir ANTES de /api/
  # ========================================
  
  # WebSocket de COMMS (notificaciones)
  location = /api/comms/ws {
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # DIRECTO A COMMS (NO gateway)
    proxy_pass http://comms:3005/api/ws;
    
    # Timeouts para WebSocket
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # WS -> game (no loguear query string para evitar tokens en URL)
  location = /api/game/ws {
    access_log off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass http://game:3003;

	# Timeouts para WebSocket
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # REST -> gateway
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass http://gateway:3000;
  }

}

