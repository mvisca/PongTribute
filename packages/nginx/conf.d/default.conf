# ============================================
# WEBSOCKET UPGRADE MAP
# ============================================
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# ============================================
# HTTP SERVER (Puerto 80) - Solo redirección
# ============================================
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

# ============================================
# HTTPS SERVER (Puerto 443)
# ============================================
server {
  listen 443 ssl http2; # http2 habilita multiplexing, 30-40% más rápido primera carga front
  server_name _;

  # ========================================
  # SSL Configuration
  # ========================================
  ssl_certificate		/etc/nginx/certs/tls.crt;
  ssl_certificate_key	/etc/nginx/certs/tls.key;
  
  # SSL protocols (deshabilitar versiones viejas)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  
  # SSL session cache
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Comentado con self-signed. Si implementamos Let's Encrypt... descomentar
  # ssl_stapling on;
  # ssl_stapling_verify on;

  # ========================================
  # Security Headers
  # ========================================
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;

  # ========================================
  # Frontend Root
  # ========================================
  root /usr/share/nginx/html;
  index index.html;

  
  # ========================================
  # SWAGGER / DOCS
  # ========================================
  location ^~ /docs {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://gateway:3000;
  }
  
  # ========================================
  # REST API (vía gateway)
  # ========================================

  location /api/ {

	# Redirige todo el tráfico de esta ruta al contenedor 
  	# Gateway en la red interna de Docker.
	proxy_pass http://gateway:3000;

	# Cabeceras estándar para proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
 
	# Cabeceras para soportar WebSocket a través de Nginx hacia Gateway
  	# Obligatorio para WebSockets, ya que 
  	# HTTP/1.0 no soporta el mecanismo de Upgrade.
    proxy_http_version 1.1;

	# Indican al Gateway que la conexión HTTP inicial debe transformarse
	# en un túnel TCP persistente (WebSocket). Si faltan, el Gateway 
	# rechazará la conexión WS.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
  

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

  }

  # ========================================
  # FRONTEND SPA (debe ir al final)
  # ========================================
  location / {
    try_files $uri $uri/ /index.html;
  }
}