<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FT_TRANSCENDENCE: Game Client</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Consolas', 'Monaco', monospace;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .controls {
      background: #161b22;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #30363d;
      margin-bottom: 20px;
      width: 100%;
      max-width: 900px;
    }

    .input-row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .input-group {
      flex: 1;
      min-width: 250px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #8b949e;
      font-size: 12px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
    }

    input:focus {
      outline: none;
      border-color: #58a6ff;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      transition: background 0.2s;
      font-size: 13px;
      width: 100%;
    }

    .btn-connect { background: #238636; }
    .btn-connect:hover { background: #2ea043; }
    .btn-disconnect { background: #da3633; }
    .btn-disconnect:hover { background: #f85149; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .url-preview {
      background: #0d1117;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      margin: 10px 0;
      font-size: 11px;
      color: #8b949e;
      word-break: break-all;
    }

    .url-preview strong {
      color: #58a6ff;
    }

    .canvas-container {
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,0.5);
      border: 2px solid #30363d;
      border-radius: 4px;
      background: #000;
    }

    canvas {
      display: block;
      max-width: 100%;
    }

    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      color: #58a6ff;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: pre-line;
      padding: 20px;
    }

    .instructions {
      margin-top: 15px;
      font-size: 13px;
      color: #8b949e;
      text-align: center;
    }

    .key {
      background: #30363d;
      color: #c9d1d9;
      padding: 2px 6px;
      border-radius: 4px;
      border-bottom: 2px solid #161b22;
      font-weight: bold;
    }

    .status-bar {
      background: #161b22;
      padding: 10px 15px;
      border-radius: 6px;
      border: 1px solid #30363d;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 900px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 14px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #da3633;
      animation: pulse 2s infinite;
    }

    .status-dot.connected { 
      background: #3fb950; 
      animation: none;
    }

    .status-dot.connecting { 
      background: #f0883e;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .debug-panel {
      background: #161b22;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #30363d;
      margin-top: 20px;
      width: 100%;
      max-width: 900px;
      max-height: 400px;
      overflow-y: auto;
    }

    .debug-panel h3 {
      color: #58a6ff;
      font-size: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .debug-controls {
      display: flex;
      gap: 5px;
    }

    .debug-controls button {
      padding: 5px 10px;
      font-size: 11px;
      width: auto;
    }

    .debug-msg {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 5px;
      padding: 8px;
      background: #0d1117;
      border-radius: 3px;
      font-family: 'Consolas', monospace;
      word-wrap: break-word;
    }

    .debug-msg.sent { border-left: 3px solid #3fb950; }
    .debug-msg.received { border-left: 3px solid #1f6feb; }
    .debug-msg.error { border-left: 3px solid #f85149; color: #f85149; }
    .debug-msg.warn { border-left: 3px solid #d29922; color: #f0883e; }
    .debug-msg.info { border-left: 3px solid #8b949e; }
  </style>
</head>
<body>

  <div class="controls">
    <div class="input-row">
      <div class="input-group">
        <label>🌐 WebSocket Base URL</label>
        <input type="text" id="wsUrl" value="ws://localhost/api/game/ws">
      </div>
    </div>
    
    <div class="input-row">
      <div class="input-group">
        <label>🔑 User Token (JWT)</label>
        <input type="password" id="token" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
      </div>
    </div>

    <div class="input-row">
      <div class="input-group">
        <label>🎮 Match ID (UUID)</label>
        <input type="text" id="matchId" placeholder="7a7fe5d6-906d-485b-8b85-6ffabf42583a">
      </div>
    </div>

    <div class="url-preview">
      <strong>URL Final:</strong> <span id="urlPreview">Configura token y matchId arriba</span>
    </div>

    <button id="btnConnect" class="btn-connect">🔌 CONECTAR</button>
  </div>

  <div class="status-bar">
    <div class="status-indicator">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">DESCONECTADO</span>
    </div>
    <div style="font-size: 11px; color: #8b949e;">
      <span id="wsState">ReadyState: -</span>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="780" height="600"></canvas>
    <div id="statusOverlay" class="overlay">⚫ DESCONECTADO\n\nConfigura token y Match ID arriba</div>
  </div>

  <div class="instructions">
    Controles Player 1: <span class="key">Q</span> (Subir) / <span class="key">A</span> (Bajar)
  </div>

  <div class="debug-panel">
    <h3>
      📋 Debug Log
      <div class="debug-controls">
        <button id="btnClearLog" style="background: #6e7681;">🗑️</button>
        <button id="btnCopyLog" style="background: #1f6feb;">📋</button>
      </div>
    </h3>
    <div id="debugLog"></div>
  </div>

  <script>
    // --- DOM REFERENCES ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const btnConnect = document.getElementById('btnConnect');
    const btnClearLog = document.getElementById('btnClearLog');
    const btnCopyLog = document.getElementById('btnCopyLog');
    const statusOverlay = document.getElementById('statusOverlay');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const wsState = document.getElementById('wsState');
    const debugLog = document.getElementById('debugLog');
    const urlPreview = document.getElementById('urlPreview');
    
    const inputs = {
      url: document.getElementById('wsUrl'),
      token: document.getElementById('token'),
      matchId: document.getElementById('matchId')
    };

    // --- STATE ---
    let ws = null;
    let isConnected = false;
    let gameState = null;
    
    let gameConfig = {
      width: 780,
      height: 600,
      paddleWidth: 10,
      paddleHeight: 60,
      ballRadius: 10
    };

    // --- URL PREVIEW ---
    function updateUrlPreview() {
      const url = inputs.url.value.trim();
      const token = inputs.token.value.trim();
      const matchId = inputs.matchId.value.trim();

      if (!token || !matchId) {
        urlPreview.textContent = 'Configura token y matchId arriba';
        return;
      }

      // Formato correcto: ?token=...&matchId=...
      const tokenPreview = token.length > 50 ? token.substring(0, 50) + '...' : token;
      urlPreview.textContent = `${url}?token=${tokenPreview}&matchId=${matchId}`;
    }

    inputs.url.addEventListener('input', updateUrlPreview);
    inputs.token.addEventListener('input', updateUrlPreview);
    inputs.matchId.addEventListener('input', updateUrlPreview);

    // --- DEBUG LOGGING ---
    function addDebugMsg(msg, type = 'info') {
      const msgDiv = document.createElement('div');
      msgDiv.className = `debug-msg ${type}`;
      const timestamp = new Date().toLocaleTimeString('es-ES', { 
        hour12: false, 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit', 
        fractionalSecondDigits: 3 
      });
      msgDiv.textContent = `[${timestamp}] ${msg}`;
      debugLog.insertBefore(msgDiv, debugLog.firstChild);
      
      while (debugLog.children.length > 100) {
        debugLog.removeChild(debugLog.lastChild);
      }
      
      console.log(`[${type.toUpperCase()}] ${msg}`);
    }

    function updateStatus(status, text) {
      statusDot.className = `status-dot ${status}`;
      statusText.textContent = text;
    }

    function updateWSState() {
      if (!ws) {
        wsState.textContent = 'ReadyState: -';
        return;
      }
      const states = ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'];
      wsState.textContent = `ReadyState: ${ws.readyState} (${states[ws.readyState]})`;
    }

    // --- INPUT HANDLING ---
    const keysPressed = new Set();
    let inputInterval = null;

    window.addEventListener('keydown', (e) => {
      if(['q', 'Q', 'a', 'A'].includes(e.key)) {
        e.preventDefault();
        keysPressed.add(e.key.toLowerCase());
      }
    });

    window.addEventListener('keyup', (e) => {
      keysPressed.delete(e.key.toLowerCase());
    });

    function startInputLoop() {
      if (inputInterval) clearInterval(inputInterval);
      
      inputInterval = setInterval(() => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        if (keysPressed.has('q')) {
          sendAction('MOVE_UP');
        } else if (keysPressed.has('a')) {
          sendAction('MOVE_DOWN');
        }
      }, 30); // 30ms = ~33fps
      
      addDebugMsg('Input loop iniciado (33fps)', 'info');
    }

    function stopInputLoop() {
      if (inputInterval) {
        clearInterval(inputInterval);
        inputInterval = null;
      }
      keysPressed.clear();
      addDebugMsg('Input loop detenido', 'info');
    }

    function sendAction(actionName) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      
      const payload = { action: actionName };
      ws.send(JSON.stringify(payload));
      
      // Log solo 10% de las acciones para no saturar
      if (Math.random() < 0.1) {
        addDebugMsg(`📤 ${actionName}`, 'sent');
      }
    }

    // --- RENDER ---
    function draw() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!gameState) return;

      // Línea central
      ctx.strokeStyle = '#333';
      ctx.setLineDash([10, 15]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Palas
      ctx.fillStyle = '#ffffff';
      
      if (gameState.player1) {
        ctx.fillRect(
          gameState.player1.x, 
          gameState.player1.y, 
          gameConfig.paddleWidth, 
          gameConfig.paddleHeight
        );
      }

      if (gameState.player2) {
        ctx.fillRect(
          gameState.player2.x, 
          gameState.player2.y, 
          gameConfig.paddleWidth, 
          gameConfig.paddleHeight
        );
      }

      // Pelota
      if (gameState.ball) {
        ctx.beginPath();
        ctx.arc(
          gameState.ball.x, 
          gameState.ball.y, 
          gameConfig.ballRadius, 
          0, 
          Math.PI * 2
        );
        ctx.fill();
      }

      // Puntuación
      if (gameState.player1 && gameState.player2) {
        ctx.font = 'bold 48px Consolas';
        ctx.fillStyle = '#58a6ff';
        ctx.fillText(gameState.player1.score || 0, (canvas.width / 2) - 80, 60);
        ctx.fillText(gameState.player2.score || 0, (canvas.width / 2) + 50, 60);
      }
    }

    // --- WEBSOCKET CONNECTION ---
    function connect() {
      if (isConnected) {
        addDebugMsg('Cerrando conexión...', 'info');
        ws.close();
        return;
      }

      const url = inputs.url.value.trim();
      const token = inputs.token.value.trim();
      const matchId = inputs.matchId.value.trim();

      if (!token || !matchId) {
        alert("⚠️ Token y Match ID son obligatorios");
        addDebugMsg('❌ Faltan parámetros requeridos', 'error');
        return;
      }

      // FORMATO CORRECTO: ?token=...&matchId=...
      const fullUrl = `${url}?token=${encodeURIComponent(token)}&matchId=${encodeURIComponent(matchId)}`;
      
      addDebugMsg(`🔌 Conectando a: ${url}`, 'info');
      addDebugMsg(`   Token: ${token.substring(0, 20)}...${token.substring(token.length - 10)}`, 'info');
      addDebugMsg(`   Match: ${matchId}`, 'info');
      
      updateStatus('connecting', 'CONECTANDO...');
      statusOverlay.textContent = '🟡 CONECTANDO...';
      
      try {
        ws = new WebSocket(fullUrl);
      } catch (error) {
        addDebugMsg(`❌ Error creando WebSocket: ${error.message}`, 'error');
        updateStatus('', 'ERROR');
        return;
      }

      updateWSState();
      
      const connectTimeout = setTimeout(() => {
        if (ws.readyState === WebSocket.CONNECTING) {
          addDebugMsg('⏱️ Timeout de conexión (10s)', 'error');
          ws.close();
        }
      }, 10000);

      ws.onopen = () => {
        clearTimeout(connectTimeout);
        addDebugMsg('✅ Conexión ESTABLECIDA', 'info');
        isConnected = true;
        btnConnect.textContent = '🔌 DESCONECTAR';
        btnConnect.classList.replace('btn-connect', 'btn-disconnect');
        updateStatus('connected', 'CONECTADO');
        statusOverlay.textContent = '🟢 CONECTADO\nEsperando datos del juego...';
        updateWSState();
        
        startInputLoop();
      };

      ws.onmessage = (event) => {
        updateWSState();
        
        try {
          const msg = JSON.parse(event.data);
          
          // Log selectivo
          if (msg.event !== 'game:update') {
            addDebugMsg(`📨 ${msg.event || 'mensaje'}`, 'received');
          }
          
          if (msg.event === 'game:update') {
            gameState = msg.data;
            
            if (msg.data.config) {
              gameConfig = msg.data.config;
              if (canvas.width !== gameConfig.width) canvas.width = gameConfig.width;
              if (canvas.height !== gameConfig.height) canvas.height = gameConfig.height;
            }
            
            if (statusOverlay.style.display !== 'none') {
              statusOverlay.style.display = 'none';
            }
            
            requestAnimationFrame(draw);
          } 
          else if (msg.event === 'game:started') {
            addDebugMsg('🎮 Partida INICIADA', 'info');
            statusOverlay.style.display = 'none';
          }
          else if (msg.event === 'game:finished') {
            const winner = msg.data?.winnerId || 'N/A';
            addDebugMsg(`🏆 Partida FINALIZADA - Ganador: ${winner}`, 'info');
            statusOverlay.textContent = `🏆 JUEGO TERMINADO\n\nGanador: ${winner}`;
            statusOverlay.style.display = 'block';
            stopInputLoop();
          }
          else if (msg.event === 'error') {
            const errorMsg = msg.message || JSON.stringify(msg.data);
            addDebugMsg(`❌ Error servidor: ${errorMsg}`, 'error');
            statusOverlay.textContent = `❌ ERROR\n\n${errorMsg}`;
            statusOverlay.style.display = 'block';
          }
          else {
            addDebugMsg(`ℹ️ ${JSON.stringify(msg).substring(0, 100)}`, 'received');
          }
        } catch (e) {
          addDebugMsg(`❌ Error parseando: ${e.message}`, 'error');
          addDebugMsg(`   Raw: ${event.data.substring(0, 100)}`, 'error');
        }
      };

      ws.onclose = (e) => {
        clearTimeout(connectTimeout);
        const reason = e.reason || 'Sin razón especificada';
        addDebugMsg(`🔌 CERRADO - Código ${e.code}: ${reason}`, 'warn');
        addDebugMsg(`   Clean: ${e.wasClean}`, 'info');
        
        isConnected = false;
        btnConnect.textContent = '🔌 CONECTAR';
        btnConnect.classList.replace('btn-disconnect', 'btn-connect');
        updateStatus('', 'DESCONECTADO');
        statusOverlay.textContent = `⚫ DESCONECTADO\n\nCódigo: ${e.code}\n${reason}`;
        statusOverlay.style.display = 'block';
        updateWSState();
        stopInputLoop();
      };

      ws.onerror = (err) => {
        addDebugMsg('❌ Error WebSocket (ver consola F12)', 'error');
        console.error('WebSocket Error:', err);
        updateWSState();
      };
    }

    // --- EVENT HANDLERS ---
    btnConnect.addEventListener('click', connect);

    btnClearLog.addEventListener('click', () => {
      debugLog.innerHTML = '';
      addDebugMsg('🗑️ Log limpiado', 'info');
    });

    btnCopyLog.addEventListener('click', () => {
      const text = Array.from(debugLog.children)
        .map(el => el.textContent)
        .reverse()
        .join('\n');
      navigator.clipboard.writeText(text).then(() => {
        addDebugMsg('📋 Log copiado', 'info');
      });
    });

    inputs.token.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !isConnected) {
        connect();
      }
    });

    inputs.matchId.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !isConnected) {
        connect();
      }
    });

    // --- INIT ---
    draw();
    updateUrlPreview();
    addDebugMsg('🎮 Cliente inicializado', 'info');
    addDebugMsg('💡 Configura token y matchId, luego CONECTAR', 'info');
    updateWSState();
  </script>
</body>
</html>
