services:
    redis:
      image: redis:7-alpine
      container_name: ft_transcendence_redis
      restart: always
      # Redis no necesita exponerse públicamente; se usa dentro de la red docker
      volumes:
        - redis-data:/data
      command: ["redis-server", "--appendonly", "yes", "--save", "300", "1"]
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 90s
        timeout: 3s
        retries: 10
        start_period: 20s
      networks:
        - transcendence
    
    gateway:
      build:
        context: .
        dockerfile: ./packages/gateway/Dockerfile
      container_name: ft_transcendence_gateway
      restart: always
      env_file:
        - .env
      #expose:
      #  - "3000"
      ports:
        - "3000:3000"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://gateway:3000/health > /dev/null || exit 1"]
        interval: 90s
        timeout: 3s
        retries: 10
      depends_on:
        auth:
          condition: service_healthy
        user:
          condition: service_healthy
        game:
          condition: service_healthy
        comms:
          condition: service_healthy
      networks:
        - transcendence

    auth:
      build:
        context: .
        dockerfile: ./packages/auth/Dockerfile
      container_name: ft_transcendence_auth
      restart: always
      env_file:
        - .env
      expose:
        - "3002"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://auth:3002/health > /dev/null || exit 1"]
        interval: 90s
        timeout: 3s
        retries: 10
      depends_on:
        redis:
          condition: service_healthy
        images:
          condition: service_healthy
      networks:
        - transcendence

    user:
      build:
        context: .
        dockerfile: ./packages/user/Dockerfile
      container_name: ft_transcendence_user
      restart: always
      env_file:
        - .env
      volumes:
        #- user-db:/var/lib/app/db
        - ${USER_SERVICE_DB_PATH}:/app/packages/user/db
      expose:
        - "3001"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://user:3001/health > /dev/null || exit 1"]
        interval: 90s
        timeout: 3s
        retries: 10
      depends_on:
        redis:
          condition: service_healthy
        images:
          condition: service_healthy
      networks:
        - transcendence

    game:
      build:
        context: .
        dockerfile: ./packages/game/Dockerfile
      container_name: ft_transcendence_game
      restart: always
      env_file:
        - .env
      volumes:
        #- game-db:/var/lib/app/db
        - ${GAME_SERVICE_DB_PATH}:/app/packages/game/db
      expose:
        - "3003"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://game:3003/health > /dev/null || exit 1"]
        interval: 90s
        timeout: 3s
        retries: 10
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - transcendence

    comms:
      build:
        context: .
        dockerfile: ./packages/comms/Dockerfile
      container_name: ft_transcendence_comms
      restart: always
      env_file:
        - .env
      expose:
        - "3005"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://comms:3005/health > /dev/null || exit 1"]
        interval: 90s
        timeout: 3s
        retries: 10
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - transcendence

    images:
      build:
        context: ./packages/images
        dockerfile: Dockerfile
      container_name: ft_transcendence_images
      restart: always
      expose:
        - "3004"
      env_file:
        - .env
      environment:
        PORT: "3004"
        RAILS_ENV: "production"
        RAILS_LOG_TO_STDOUT: "true"
      volumes:
        - ./packages/shared/contracts:/app/contracts:ro
      deploy:
        resources:
          limits:
            memory: 256M
            cpus: '0.5'
          reservations:
            memory: 128M
      healthcheck:
        test: ["CMD-SHELL", "wget -q --spider http://images:3004/health || exit 1"]
        interval: 90s
        timeout: 3s
        retries: 3
        start_period: 40s
      networks:
        - transcendence
      depends_on:
        redis:
          condition: service_healthy

    nginx:
      build:
        context: .
        dockerfile: ./packages/nginx/Dockerfile
      container_name: ft_transcendence_nginx
      restart: always
      ports:
        - "80:80"
        - "443:443"
      volumes:
        # Certs persistentes para dev (autogenerados si no existen)
        - ./packages/nginx/certs:/etc/nginx/certs
      depends_on:
        gateway:
          condition: service_healthy
#        game:
 #         condition: service_healthy
 # Comentado por redundancia, gateway ya depende de Game, por tanto si hay gateway hay game 
      networks:
        - transcendence

volumes:
  redis-data:
    driver: local
  user-db:
    driver: local
  game-db:
    driver: local

networks:
  transcendence:
    driver: bridge
