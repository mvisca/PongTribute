services:
    redis:
      image: redis:7-alpine
      container_name: ft_transcendence_redis
      ports:
        - "${REDIS_PORT}:6379"
      volumes:
        - redis-data:/data
      command: ["redis-server", "--appendonly", "yes", "--save", "300", "1"]
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 5

volumes:
  redis-data:
    driver: local
