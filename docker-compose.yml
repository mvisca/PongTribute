services:
    # =====================
    # redis
    # =====================
    redis:
      image: redis:7-alpine
      container_name: ft_transcendence_redis
      restart: always
      volumes:
        - redis-data:/data
      command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--save", "300", "1"]  
      healthcheck:
        test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 10s
      networks:
        - transcendence

    # =====================
    # mailpit (dev SMTP)
    # =====================
    mailpit:
      # `mailpit/mailpit` no es multi-arch y en ARM64 puede fallar con "exec format error".
      # Mailpit es un reemplazo compatible (multi-arch) manteniendo SMTP 1025 y UI 8025.
      image: axllent/mailpit:latest
      container_name: ft_transcendence_mailpit
      restart: on-failure
      ports:
        # UI: http://localhost:8025
        - "8025:8025"
        # SMTP
        - "1025:1025"
      networks:
        - transcendence

    # =====================
    # auth
    # =====================
    auth:
      build:
        context: .
        dockerfile: ./packages/auth/Dockerfile
      container_name: ft_transcendence_auth
      restart: on-failure
      env_file:
        - .env
      expose:
        - "3002"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://auth:3002/health > /dev/null || exit 1"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 20s
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - transcendence

    # =====================
    # user
    # =====================
    user:
      build:
        context: .
        dockerfile: ./packages/user/Dockerfile
      container_name: ft_transcendence_user
      restart: on-failure
      env_file:
        - .env
      environment:
        - NODE_ENV=production
      volumes:
        - ${USER_SERVICE_DB_PATH}:/app/packages/user/db
      expose:
        - "3001"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://user:3001/health > /dev/null || exit 1"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 20s
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - transcendence

    # =====================
    # game
    # =====================
    game:
      build:
        context: .
        dockerfile: ./packages/game/Dockerfile
      container_name: ft_transcendence_game
      restart: on-failure
      env_file:
        - .env
      environment:
        - NODE_ENV=production
      volumes:
        - ${GAME_SERVICE_DB_PATH}:/app/packages/game/db
      expose:
        - "3003"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://game:3003/health > /dev/null || exit 1"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 20s
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - transcendence

    # =====================
    # comms
    # =====================
    comms:
      build:
        context: .
        dockerfile: ./packages/comms/Dockerfile
      container_name: ft_transcendence_comms
      restart: on-failure
      env_file:
        - .env
      environment:
        - NODE_ENV=production
      expose:
        - "3005"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://comms:3005/health > /dev/null || exit 1"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 15s
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - transcendence

    # =====================
    # gateway
    # =====================
    gateway:
      build:
        context: .
        dockerfile: ./packages/gateway/Dockerfile
      container_name: ft_transcendence_gateway
      restart: on-failure
      env_file:
        - .env
      environment:
        - NODE_ENV=production
      expose:
        - "3000"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://gateway:3000/health > /dev/null || exit 1"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 15s
      depends_on:
        auth:
          condition: service_healthy
        user:
          condition: service_healthy
        game:
          condition: service_healthy
        comms:
          condition: service_healthy
      networks:
        - transcendence

    # =====================
    # images
    # =====================
    images:
      build:
        context: ./packages/images
        dockerfile: Dockerfile
      container_name: ft_transcendence_images
      restart: on-failure
      expose:
        - "3004"
      env_file:
        - .env
      environment:
        PORT: "3004"
        RAILS_ENV: "production"
        RAILS_LOG_TO_STDOUT: "true"
      volumes:
        - ./packages/shared/contracts:/app/contracts:ro
      deploy:
        resources:
          limits:
            memory: 256M
            cpus: '0.5'
          reservations:
            memory: 128M
      healthcheck:
        test: ["CMD-SHELL", "wget -q --spider http://images:3004/health || exit 1"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 40s
      networks:
        - transcendence
      depends_on:
        user:
          condition: service_healthy
        redis:
          condition: service_healthy

    # =====================
    # nginx
    # =====================
    nginx:
      build:
        context: .
        dockerfile: ./packages/nginx/Dockerfile
      container_name: ft_transcendence_nginx
      restart: always
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./packages/nginx/certs:/etc/nginx/certs
      healthcheck:
        test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
        interval: 15s
        timeout: 3s
        retries: 3
        start_period: 10s
      depends_on:
        gateway:
          condition: service_healthy
      networks:
        - transcendence

volumes:
  redis-data:
    driver: local
  user-db:
    driver: local
  game-db:
    driver: local

networks:
  transcendence:
    driver: bridge
