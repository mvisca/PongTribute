services:
    # =====================
    # redis
    # =====================
    redis:
      image: redis:7-alpine
      container_name: ft_transcendence_redis
      restart: always
      volumes:
        - redis-data:/data
      command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--save", "300", "1"]  
      healthcheck:
        test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 10s
      networks:
        - transcendence

    # =====================
    # auth
    # =====================
    auth:
      build:
        context: .
        dockerfile: ./packages/auth/Dockerfile
      container_name: ft_transcendence_auth
      restart: on-failure
      env_file:
        - .env
      expose:
        - "3002"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://auth:3002/health > /dev/null || exit 1"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 20s
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - transcendence

    # =====================
    # user
    # =====================
    user:
      build:
        context: .
        dockerfile: ./packages/user/Dockerfile
      container_name: ft_transcendence_user
      restart: on-failure
      env_file:
        - .env
      environment:
        - NODE_ENV=production
      volumes:
        - user-db:/app/packages/user/db
      expose:
        - "3001"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://user:3001/health > /dev/null || exit 1"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 20s
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - transcendence

    # =====================
    # game
    # =====================
    game:
      build:
        context: .
        dockerfile: ./packages/game/Dockerfile
      container_name: ft_transcendence_game
      restart: on-failure
      env_file:
        - .env
      environment:
        - NODE_ENV=production
      volumes:
        - game-db:/app/packages/game/db
      expose:
        - "3003"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://game:3003/health > /dev/null || exit 1"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 20s
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - transcendence

    # =====================
    # comms
    # =====================
    comms:
      build:
        context: .
        dockerfile: ./packages/comms/Dockerfile
      container_name: ft_transcendence_comms
      restart: on-failure
      env_file:
        - .env
      environment:
        - NODE_ENV=production
      expose:
        - "3005"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://comms:3005/health > /dev/null || exit 1"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 15s
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - transcendence

    # =====================
    # gateway
    # =====================
    gateway:
      build:
        context: .
        dockerfile: ./packages/gateway/Dockerfile
      container_name: ft_transcendence_gateway
      restart: on-failure
      env_file:
        - .env
      environment:
        - NODE_ENV=production
        - WS_MAX_CONNECTIONS_PER_IP=100   # el bot ocupa 1 conexión por partida desde la misma IP del contenedor
      expose:
        - "3000"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://gateway:3000/health > /dev/null || exit 1"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 15s
      depends_on:
        auth:
          condition: service_healthy
        user:
          condition: service_healthy
        game:
          condition: service_healthy
        comms:
          condition: service_healthy
      networks:
        - transcendence

    # =====================
    # images
    # =====================
    images:
      build:
        context: .
        dockerfile: ./packages/images/Dockerfile
      container_name: ft_transcendence_images
      restart: on-failure
      expose:
        - "3004"
      env_file:
        - .env
      environment:
        PORT: "3004"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://images:3004/health > /dev/null || exit 1"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 40s
      networks:
        - transcendence
      depends_on:
        user:
          condition: service_healthy
        redis:
          condition: service_healthy

    # =====================
    # nginx
    # =====================
    nginx:
      build:
        context: .
        dockerfile: ./packages/nginx/Dockerfile
        args:
          VITE_API_URL: ${VITE_API_URL}
          VITE_WS_COMMS_URL: ${VITE_WS_COMMS_URL}
          VITE_WS_GAME_URL: ${VITE_WS_GAME_URL}
          VITE_DEFAULT_AVATAR: ${VITE_DEFAULT_AVATAR}
      container_name: ft_transcendence_nginx
      restart: always
      env_file:
        - .env
      environment:
        - HOST_UID=${UID}
        - HOST_GID=${GID}
      ports:
        - "8080:80"
        - "8443:443"
      volumes:
        - ./packages/nginx/certs:/etc/nginx/certs
      healthcheck:
        test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/health || exit 1"]
        interval: 15s
        timeout: 3s
        retries: 3
        start_period: 10s
      depends_on:
        gateway:
          condition: service_healthy
      networks:
        - transcendence
    
    # =====================
    # bot
    # =====================
    bot:
      build:
        context: .
        dockerfile: ./packages/bot/Dockerfile
      container_name: ft_transcendence_bot
      restart: on-failure
      env_file:
        - .env
      environment:
        - NODE_ENV=production
        - GATEWAY_URL=http://gateway:3000   # sin esto BotEnv.GAME_WS_URL() resuelve a ws://localhost:3000 (el propio contenedor)
      expose:
        - "3007"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://bot:3007/health > /dev/null || exit 1"]
        interval: 45s
        timeout: 3s
        retries: 3
        start_period: 15s
      depends_on:
        redis:
          condition: service_healthy
        gateway:
          condition: service_healthy
      networks:
        - transcendence

volumes:
  redis-data:
    driver: local
  user-db:
    driver: local
  game-db:
    driver: local

networks:
  transcendence:
    driver: bridge
