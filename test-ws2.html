<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FT_TRANSCENDENCE: Local Game (2 Players)</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Consolas', 'Monaco', monospace;
			background: #0d1117;
			color: #c9d1d9;
			display: flex;
			flex-direction: column;
			align-items: center;
			min-height: 100vh;
			padding: 20px;
		}

		.controls {
			background: #161b22;
			padding: 20px;
			border-radius: 8px;
			border: 1px solid #30363d;
			margin-bottom: 20px;
			width: 100%;
			max-width: 900px;
		}

		.input-row {
			display: flex;
			gap: 15px;
			flex-wrap: wrap;
			margin-bottom: 15px;
		}

		.input-group {
			flex: 1;
			min-width: 200px;
		}

		label {
			display: block;
			margin-bottom: 5px;
			color: #8b949e;
			font-size: 12px;
			font-weight: bold;
		}

		input,
		select {
			width: 100%;
			padding: 8px 12px;
			background: #0d1117;
			border: 1px solid #30363d;
			color: #c9d1d9;
			border-radius: 6px;
			font-family: inherit;
			font-size: 13px;
		}

		input:focus,
		select:focus {
			outline: none;
			border-color: #58a6ff;
		}

		button {
			padding: 10px 20px;
			border: none;
			border-radius: 6px;
			font-weight: bold;
			cursor: pointer;
			color: white;
			transition: background 0.2s;
			font-size: 13px;
			width: 100%;
		}

		.btn-create {
			background: #1f6feb;
		}

		.btn-create:hover {
			background: #388bfd;
		}

		.btn-connect {
			background: #238636;
		}

		.btn-connect:hover {
			background: #2ea043;
		}

		.btn-disconnect {
			background: #da3633;
		}

		.btn-disconnect:hover {
			background: #f85149;
		}

		button:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		.btn-row {
			display: flex;
			gap: 10px;
			margin-bottom: 10px;
		}

		.btn-row button {
			flex: 1;
		}

		.url-preview {
			background: #0d1117;
			padding: 10px;
			border-radius: 6px;
			border: 1px solid #30363d;
			margin: 10px 0;
			font-size: 11px;
			color: #8b949e;
			word-break: break-all;
		}

		.url-preview strong {
			color: #58a6ff;
		}

		.canvas-container {
			position: relative;
			box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
			border: 2px solid #30363d;
			border-radius: 4px;
			background: #000;
		}

		canvas {
			display: block;
			max-width: 100%;
		}

		.overlay {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			font-size: 24px;
			color: #58a6ff;
			text-align: center;
			pointer-events: none;
			text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
			white-space: pre-line;
			padding: 20px;
		}

		.instructions {
			margin-top: 15px;
			font-size: 13px;
			color: #8b949e;
			text-align: center;
			line-height: 2;
		}

		.key {
			background: #30363d;
			color: #c9d1d9;
			padding: 2px 8px;
			border-radius: 4px;
			border-bottom: 2px solid #161b22;
			font-weight: bold;
		}

		.player-label {
			font-weight: bold;
			padding: 2px 8px;
			border-radius: 4px;
			font-size: 12px;
		}

		.p1-label {
			background: #1f6feb33;
			color: #58a6ff;
		}

		.p2-label {
			background: #da363333;
			color: #f85149;
		}

		.status-bar {
			background: #161b22;
			padding: 10px 15px;
			border-radius: 6px;
			border: 1px solid #30363d;
			margin-bottom: 15px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			max-width: 900px;
		}

		.status-indicator {
			display: flex;
			align-items: center;
			gap: 10px;
			font-weight: bold;
			font-size: 14px;
		}

		.status-dot {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background: #da3633;
			animation: pulse 2s infinite;
		}

		.status-dot.connected {
			background: #3fb950;
			animation: none;
		}

		.status-dot.connecting {
			background: #f0883e;
		}

		@keyframes pulse {

			0%,
			100% {
				opacity: 1;
			}

			50% {
				opacity: 0.5;
			}
		}

		.debug-panel {
			background: #161b22;
			padding: 15px;
			border-radius: 8px;
			border: 1px solid #30363d;
			margin-top: 20px;
			width: 100%;
			max-width: 900px;
			max-height: 400px;
			overflow-y: auto;
		}

		.debug-panel h3 {
			color: #58a6ff;
			font-size: 14px;
			margin-bottom: 10px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.debug-controls {
			display: flex;
			gap: 5px;
		}

		.debug-controls button {
			padding: 5px 10px;
			font-size: 11px;
			width: auto;
		}

		.debug-msg {
			font-size: 11px;
			color: #8b949e;
			margin-bottom: 5px;
			padding: 8px;
			background: #0d1117;
			border-radius: 3px;
			font-family: 'Consolas', monospace;
			word-wrap: break-word;
		}

		.debug-msg.sent {
			border-left: 3px solid #3fb950;
		}

		.debug-msg.received {
			border-left: 3px solid #1f6feb;
		}

		.debug-msg.error {
			border-left: 3px solid #f85149;
			color: #f85149;
		}

		.debug-msg.warn {
			border-left: 3px solid #d29922;
			color: #f0883e;
		}

		.debug-msg.info {
			border-left: 3px solid #8b949e;
		}

		.match-info {
			background: #0d1117;
			padding: 10px;
			border-radius: 6px;
			border: 1px solid #30363d;
			margin: 10px 0;
			font-size: 12px;
		}

		.match-info .field {
			margin-bottom: 4px;
		}

		.match-info .value {
			color: #58a6ff;
		}
	</style>
</head>

<body>

	<h2 style="color: #58a6ff; margin-bottom: 15px;">🎮 Local Game — 2 Jugadores, 1 Teclado</h2>

	<div class="controls">
		<!-- Step 1: Config -->
		<div class="input-row">
			<div class="input-group">
				<label>🌐 API Base URL</label>
				<input type="text" id="apiUrl" value="http://localhost/api">
			</div>
			<div class="input-group">
				<label>🌐 WebSocket Base URL</label>
				<input type="text" id="wsUrl" value="ws://localhost/api/game/ws">
			</div>
		</div>

		<div class="input-row">
			<div class="input-group">
				<label>🔑 User Token (JWT)</label>
				<input type="password" id="token" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
			</div>
		</div>

		<div class="input-row">
			<div class="input-group">
				<label>🎯 Game Mode</label>
				<select id="gameMode">
					<option value="classic" selected>Classic</option>
					<option value="speed">Speed</option>
					<option value="pro">Pro (Inercia)</option>
				</select>
			</div>
			<div class="input-group">
				<label>🏆 Target Score</label>
				<input type="number" id="targetScore" value="5" min="1" max="21">
			</div>
		</div>

		<div class="input-row">
			<div class="input-group">
				<label>🎮 Match ID (manual, si ya tienes uno)</label>
				<input type="text" id="matchId" placeholder="Pega aquí el UUID del match si lo creaste externamente">
			</div>
		</div>

		<!-- Step 2: Actions -->
		<div class="btn-row">
			<button id="btnCreate" class="btn-create">1️⃣ CREAR PARTIDA LOCAL</button>
			<button id="btnConnect" class="btn-connect">2️⃣ CONECTAR WS</button>
		</div>

		<!-- Match info -->
		<div id="matchInfo" class="match-info" style="display: none;">
			<div class="field"><strong>Match ID:</strong> <span id="matchIdDisplay" class="value">—</span></div>
			<div class="field"><strong>Status:</strong> <span id="matchStatusDisplay" class="value">—</span></div>
			<div class="field"><strong>Mode:</strong> <span id="matchModeDisplay" class="value">—</span></div>
			<div class="field"><strong>Target Score:</strong> <span id="matchScoreDisplay" class="value">—</span></div>
		</div>

		<div class="url-preview">
			<strong>WS URL:</strong> <span id="urlPreview">Crea una partida primero</span>
		</div>
	</div>

	<div class="status-bar">
		<div class="status-indicator">
			<div id="statusDot" class="status-dot"></div>
			<span id="statusText">DESCONECTADO</span>
		</div>
		<div style="font-size: 11px; color: #8b949e;">
			<span id="wsState">ReadyState: -</span>
		</div>
	</div>

	<div class="canvas-container">
		<canvas id="gameCanvas" width="800" height="600"></canvas>
		<div id="statusOverlay" class="overlay">⚫ DESCONECTADO\n\nCrea una partida local y conecta</div>
	</div>

	<div class="instructions">
		<span class="player-label p1-label">P1 (Izquierda)</span>
		<span class="key">W</span> Subir &nbsp;/&nbsp; <span class="key">S</span> Bajar
		&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp;
		<span class="player-label p2-label">P2 (Derecha)</span>
		<span class="key">↑</span> Subir &nbsp;/&nbsp; <span class="key">↓</span> Bajar
	</div>

	<div class="debug-panel">
		<h3>
			📋 Debug Log
			<div class="debug-controls">
				<button id="btnClearLog" style="background: #6e7681;">🗑️</button>
				<button id="btnCopyLog" style="background: #1f6feb;">📋</button>
			</div>
		</h3>
		<div id="debugLog"></div>
	</div>

	<script>
		// =====================================================================
		// DOM REFERENCES
		// =====================================================================
		const canvas = document.getElementById('gameCanvas');
		const ctx = canvas.getContext('2d');
		const btnCreate = document.getElementById('btnCreate');
		const btnConnect = document.getElementById('btnConnect');
		const btnClearLog = document.getElementById('btnClearLog');
		const btnCopyLog = document.getElementById('btnCopyLog');
		const statusOverlay = document.getElementById('statusOverlay');
		const statusDot = document.getElementById('statusDot');
		const statusText = document.getElementById('statusText');
		const wsState = document.getElementById('wsState');
		const debugLog = document.getElementById('debugLog');
		const urlPreview = document.getElementById('urlPreview');
		const matchInfo = document.getElementById('matchInfo');

		const inputs = {
			apiUrl: document.getElementById('apiUrl'),
			wsUrl: document.getElementById('wsUrl'),
			token: document.getElementById('token'),
			gameMode: document.getElementById('gameMode'),
			targetScore: document.getElementById('targetScore'),
			matchId: document.getElementById('matchId')
		};

		// =====================================================================
		// STATE
		// =====================================================================
		let ws = null;
		let isConnected = false;
		let gameState = null;
		let currentMatchId = null;

		let gameConfig = {
			width: 800,
			height: 600,
			paddleWidth: 10,
			paddleHeight: 60,
			ballRadius: 6
		};

		// =====================================================================
		// DEBUG LOGGING
		// =====================================================================
		function addDebugMsg(msg, type = 'info') {
			const msgDiv = document.createElement('div');
			msgDiv.className = `debug-msg ${type}`;
			const timestamp = new Date().toLocaleTimeString('es-ES', {
				hour12: false,
				hour: '2-digit',
				minute: '2-digit',
				second: '2-digit',
				fractionalSecondDigits: 3
			});
			msgDiv.textContent = `[${timestamp}] ${msg}`;
			debugLog.insertBefore(msgDiv, debugLog.firstChild);

			while (debugLog.children.length > 150) {
				debugLog.removeChild(debugLog.lastChild);
			}

			console.log(`[${type.toUpperCase()}] ${msg}`);
		}

		function updateStatus(status, text) {
			statusDot.className = `status-dot ${status}`;
			statusText.textContent = text;
		}

		function updateWSState() {
			if (!ws) {
				wsState.textContent = 'ReadyState: -';
				return;
			}
			const states = ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'];
			wsState.textContent = `ReadyState: ${ws.readyState} (${states[ws.readyState]})`;
		}

		// =====================================================================
		// STEP 1: CREAR PARTIDA LOCAL (REST)
		// =====================================================================
		async function createLocalMatch() {
			const apiUrl = inputs.apiUrl.value.trim();
			const token = inputs.token.value.trim();
			const gameMode = inputs.gameMode.value;
			const targetScore = parseInt(inputs.targetScore.value) || 5;

			if (!token) {
				alert('⚠️ Token JWT es obligatorio');
				addDebugMsg('❌ Falta token JWT', 'error');
				return;
			}

			addDebugMsg(`📡 Creando partida local (mode: ${gameMode}, score: ${targetScore})...`, 'info');
			btnCreate.disabled = true;
			btnCreate.textContent = '⏳ Creando...';

			try {
				const response = await fetch(`${apiUrl}/matches`, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'Authorization': `Bearer ${token}`
					},
					body: JSON.stringify({
						matchType: 'local',
						gameMode: gameMode,
						targetScore: targetScore
					})
				});

				if (!response.ok) {
					const errorBody = await response.text();
					throw new Error(`HTTP ${response.status}: ${errorBody}`);
				}

				const match = await response.json();
				currentMatchId = match.id;
				inputs.matchId.value = match.id; // Sincronizar campo manual

				addDebugMsg(`✅ Partida creada: ${match.id}`, 'info');
				addDebugMsg(`   Mode: ${match.gameMode} | Score: ${match.targetScore}`, 'info');
				addDebugMsg(`   P1: ${match.player1.username} | P2: ${match.player2.username}`, 'info');

				// Mostrar info del match
				matchInfo.style.display = 'block';
				document.getElementById('matchIdDisplay').textContent = match.id;
				document.getElementById('matchStatusDisplay').textContent = match.status;
				document.getElementById('matchModeDisplay').textContent = match.gameMode;
				document.getElementById('matchScoreDisplay').textContent = match.targetScore;

				// Actualizar URL preview
				const wsUrl = inputs.wsUrl.value.trim();
				const tokenPreview = token.length > 50 ? token.substring(0, 50) + '...' : token;
				urlPreview.textContent = `${wsUrl}?token=${tokenPreview}&matchId=${match.id}`;

				btnCreate.textContent = '✅ PARTIDA CREADA';

				addDebugMsg('💡 Ahora pulsa "CONECTAR WS" (tienes ~30s antes de que expire)', 'warn');

			} catch (error) {
				addDebugMsg(`❌ Error creando partida: ${error.message}`, 'error');
				btnCreate.disabled = false;
				btnCreate.textContent = '1️⃣ CREAR PARTIDA LOCAL';
			}
		}

		// =====================================================================
		// STEP 2: CONECTAR WEBSOCKET
		// =====================================================================
		function connectWS() {
			if (isConnected) {
				addDebugMsg('Cerrando conexión...', 'info');
				ws.close();
				return;
			}

			// Permitir ID manual si no se creó vía REST
			if (!currentMatchId) {
				const manualId = inputs.matchId.value.trim();
				if (!manualId) {
					alert('⚠️ Primero crea una partida local o pega un Match ID manualmente');
					return;
				}
				currentMatchId = manualId;
				addDebugMsg(`📝 Usando Match ID manual: ${currentMatchId}`, 'info');
			}

			const wsUrl = inputs.wsUrl.value.trim();
			const token = inputs.token.value.trim();

			const fullUrl = `${wsUrl}?token=${encodeURIComponent(token)}&matchId=${encodeURIComponent(currentMatchId)}`;

			addDebugMsg(`🔌 Conectando WS...`, 'info');
			addDebugMsg(`   Match: ${currentMatchId}`, 'info');

			updateStatus('connecting', 'CONECTANDO...');
			statusOverlay.textContent = '🟡 CONECTANDO...';

			try {
				ws = new WebSocket(fullUrl);
			} catch (error) {
				addDebugMsg(`❌ Error creando WebSocket: ${error.message}`, 'error');
				updateStatus('', 'ERROR');
				return;
			}

			updateWSState();

			const connectTimeout = setTimeout(() => {
				if (ws.readyState === WebSocket.CONNECTING) {
					addDebugMsg('⏱️ Timeout de conexión (10s)', 'error');
					ws.close();
				}
			}, 10000);

			ws.onopen = () => {
				clearTimeout(connectTimeout);
				addDebugMsg('✅ Conexión WS ESTABLECIDA', 'info');
				isConnected = true;
				btnConnect.textContent = '🔌 DESCONECTAR';
				btnConnect.classList.replace('btn-connect', 'btn-disconnect');
				btnCreate.disabled = true;
				updateStatus('connected', 'CONECTADO');
				statusOverlay.textContent = '🟢 CONECTADO\nEsperando inicio del juego...';
				updateWSState();

				startInputLoop();
			};

			ws.onmessage = (event) => {
				updateWSState();

				try {
					const msg = JSON.parse(event.data);

					// Log selectivo (no loguear cada frame)
					if (msg.event !== 'game:update') {
						addDebugMsg(`📨 ${msg.event || 'mensaje'}: ${JSON.stringify(msg.data || {}).substring(0, 120)}`, 'received');
					}

					if (msg.event === 'game:update') {
						gameState = msg.data;

						// Actualizar config del canvas si viene
						if (msg.data.config) {
							gameConfig = msg.data.config;
							if (canvas.width !== gameConfig.width) canvas.width = gameConfig.width;
							if (canvas.height !== gameConfig.height) canvas.height = gameConfig.height;
						}

						if (statusOverlay.style.display !== 'none') {
							statusOverlay.style.display = 'none';
						}

						requestAnimationFrame(draw);
					}
					else if (msg.event === 'match:joined') {
						addDebugMsg(`🎮 Unido a la partida: ${msg.data?.matchId}`, 'info');
					}
					else if (msg.event === 'game:start') {
						addDebugMsg('🎮 Partida INICIADA', 'info');
						statusOverlay.style.display = 'none';
					}
					else if (msg.event === 'game:over') {
						const winnerId = msg.data?.winnerId || 'N/A';
						const reason = msg.data?.reason || '';
						addDebugMsg(`🏆 Partida FINALIZADA - Ganador: ${winnerId} (${reason})`, 'info');

						// Determinar texto ganador
						let winText = '';
						if (gameState) {
							const p1Score = gameState.player1?.score || 0;
							const p2Score = gameState.player2?.score || 0;
							winText = `\n\nP1: ${p1Score} - P2: ${p2Score}`;
						}

						statusOverlay.textContent = `🏆 JUEGO TERMINADO${winText}`;
						statusOverlay.style.display = 'block';
						stopInputLoop();

						// Permitir crear nueva partida
						btnCreate.disabled = false;
						btnCreate.textContent = '1️⃣ CREAR PARTIDA LOCAL';
					}
					else if (msg.event === 'error') {
						const errorMsg = msg.message || JSON.stringify(msg.data);
						addDebugMsg(`❌ Error servidor: ${errorMsg}`, 'error');
						statusOverlay.textContent = `❌ ERROR\n\n${errorMsg}`;
						statusOverlay.style.display = 'block';
					}
					else {
						addDebugMsg(`ℹ️ ${JSON.stringify(msg).substring(0, 150)}`, 'received');
					}
				} catch (e) {
					addDebugMsg(`❌ Error parseando: ${e.message}`, 'error');
					addDebugMsg(`   Raw: ${event.data.substring(0, 150)}`, 'error');
				}
			};

			ws.onclose = (e) => {
				clearTimeout(connectTimeout);
				const reason = e.reason || 'Sin razón especificada';
				addDebugMsg(`🔌 WS CERRADO - Código ${e.code}: ${reason}`, 'warn');
				addDebugMsg(`   Clean: ${e.wasClean}`, 'info');

				isConnected = false;
				btnConnect.textContent = '2️⃣ CONECTAR WS';
				btnConnect.classList.replace('btn-disconnect', 'btn-connect');
				btnCreate.disabled = false;
				btnCreate.textContent = '1️⃣ CREAR PARTIDA LOCAL';
				currentMatchId = null;
				updateStatus('', 'DESCONECTADO');
				statusOverlay.textContent = `⚫ DESCONECTADO\n\nCódigo: ${e.code}\n${reason}`;
				statusOverlay.style.display = 'block';
				updateWSState();
				stopInputLoop();
			};

			ws.onerror = (err) => {
				addDebugMsg('❌ Error WebSocket (ver consola F12)', 'error');
				console.error('WebSocket Error:', err);
				updateWSState();
			};
		}

		// =====================================================================
		// INPUT HANDLING (2 Jugadores, 1 Teclado)
		// =====================================================================
		// P1 (Left paddle):  W = UP,    S = DOWN
		// P2 (Right paddle): ↑ = UP,    ↓ = DOWN
		const keysPressed = new Set();
		let inputInterval = null;

		window.addEventListener('keydown', (e) => {
			// P1 keys
			if (['w', 'W', 's', 'S'].includes(e.key)) {
				e.preventDefault();
				keysPressed.add(e.key.toLowerCase());
			}
			// P2 keys
			if (['ArrowUp', 'ArrowDown'].includes(e.key)) {
				e.preventDefault();
				keysPressed.add(e.key);
			}
		});

		window.addEventListener('keyup', (e) => {
			keysPressed.delete(e.key.toLowerCase());
			keysPressed.delete(e.key); // Para ArrowUp/ArrowDown que no se lowercasean
		});

		function startInputLoop() {
			if (inputInterval) clearInterval(inputInterval);

			inputInterval = setInterval(() => {
				if (!ws || ws.readyState !== WebSocket.OPEN) return;

				// --- Player 1 (Left) ---
				if (keysPressed.has('w')) {
					sendAction('MOVE_UP', 'left');
				} else if (keysPressed.has('s')) {
					sendAction('MOVE_DOWN', 'left');
				}

				// --- Player 2 (Right) ---
				if (keysPressed.has('ArrowUp')) {
					sendAction('MOVE_UP', 'right');
				} else if (keysPressed.has('ArrowDown')) {
					sendAction('MOVE_DOWN', 'right');
				}
			}, 30); // ~33fps input polling

			addDebugMsg('🎮 Input loop iniciado (P1: W/S | P2: ↑/↓)', 'info');
		}

		function stopInputLoop() {
			if (inputInterval) {
				clearInterval(inputInterval);
				inputInterval = null;
			}
			keysPressed.clear();
			addDebugMsg('Input loop detenido', 'info');
		}

		function sendAction(actionName, playerSide) {
			if (!ws || ws.readyState !== WebSocket.OPEN) return;

			const payload = {
				action: actionName,
				playerSide: playerSide  // 'left' o 'right' — GameService lo usa en isLocal
			};
			ws.send(JSON.stringify(payload));

			// Log esporádico para no saturar
			if (Math.random() < 0.05) {
				addDebugMsg(`📤 ${playerSide.toUpperCase()} → ${actionName}`, 'sent');
			}
		}

		// =====================================================================
		// RENDER
		// =====================================================================
		function draw() {
			ctx.fillStyle = '#000000';
			ctx.fillRect(0, 0, canvas.width, canvas.height);

			if (!gameState) return;

			// Línea central
			ctx.strokeStyle = '#333';
			ctx.setLineDash([10, 15]);
			ctx.beginPath();
			ctx.moveTo(canvas.width / 2, 0);
			ctx.lineTo(canvas.width / 2, canvas.height);
			ctx.stroke();
			ctx.setLineDash([]);

			// Palas
			// P1 = Azul, P2 = Rojo
			if (gameState.player1) {
				ctx.fillStyle = '#58a6ff';
				ctx.fillRect(
					gameState.player1.x,
					gameState.player1.y,
					gameConfig.paddleWidth,
					gameConfig.paddleHeight
				);
			}

			if (gameState.player2) {
				ctx.fillStyle = '#f85149';
				ctx.fillRect(
					gameState.player2.x,
					gameState.player2.y,
					gameConfig.paddleWidth,
					gameConfig.paddleHeight
				);
			}

			// Pelota
			if (gameState.ball) {
				ctx.fillStyle = '#ffffff';
				ctx.beginPath();
				ctx.arc(
					gameState.ball.x,
					gameState.ball.y,
					gameConfig.ballRadius,
					0,
					Math.PI * 2
				);
				ctx.fill();
			}

			// Puntuación
			if (gameState.player1 && gameState.player2) {
				ctx.font = 'bold 48px Consolas';

				// P1 score (azul)
				ctx.fillStyle = '#58a6ff';
				ctx.fillText(gameState.player1.score || 0, (canvas.width / 2) - 80, 60);

				// P2 score (rojo)
				ctx.fillStyle = '#f85149';
				ctx.fillText(gameState.player2.score || 0, (canvas.width / 2) + 50, 60);
			}

			// Labels
			ctx.font = '12px Consolas';
			ctx.fillStyle = '#58a6ff';
			ctx.fillText('P1 (W/S)', 10, canvas.height - 10);
			ctx.fillStyle = '#f85149';
			ctx.fillText('P2 (↑/↓)', canvas.width - 80, canvas.height - 10);
		}

		// =====================================================================
		// EVENT HANDLERS
		// =====================================================================
		btnCreate.addEventListener('click', createLocalMatch);
		btnConnect.addEventListener('click', connectWS);

		btnClearLog.addEventListener('click', () => {
			debugLog.innerHTML = '';
			addDebugMsg('🗑️ Log limpiado', 'info');
		});

		btnCopyLog.addEventListener('click', () => {
			const text = Array.from(debugLog.children)
				.map(el => el.textContent)
				.reverse()
				.join('\n');
			navigator.clipboard.writeText(text).then(() => {
				addDebugMsg('📋 Log copiado', 'info');
			});
		});

		// =====================================================================
		// INIT
		// =====================================================================
		draw();
		addDebugMsg('🎮 Cliente LOCAL inicializado', 'info');
		addDebugMsg('💡 Paso 1: Pega tu JWT token', 'info');
		addDebugMsg('💡 Paso 2: Configura modo y score', 'info');
		addDebugMsg('💡 Paso 3: Pulsa "CREAR PARTIDA LOCAL"', 'info');
		addDebugMsg('💡 Paso 4: Pulsa "CONECTAR WS" (antes de 15s)', 'info');
		updateWSState();
	</script>
</body>

</html>
